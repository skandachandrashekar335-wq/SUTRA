<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 48" fill="none" role="img" aria-label="SUTRA logo">
  <!-- Thread/knot motif: three interlocking loops representing the sutra (thread) -->
  <circle cx="14" cy="24" r="9" stroke="#1D6A6A" stroke-width="2.5" fill="none"/>
  <circle cx="24" cy="24" r="9" stroke="#1D6A6A" stroke-width="2.5" fill="none" opacity="0.55"/>
  <circle cx="19" cy="16" r="9" stroke="#D97706" stroke-width="2.5" fill="none" opacity="0.4"/>
  <!-- Wordmark -->
  <text x="42" y="31" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" letter-spacing="3" fill="#18181A">SUTRA</text>
</svg>
